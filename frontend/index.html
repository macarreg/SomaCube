<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOMA Cube Solver</title>
    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/",
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="icon-in" viewBox="0 0 24 24"><path d="M17 7 7 17M17 17H7V7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="icon-out" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="icon-rotate-x" viewBox="0 0 24 24">
                <!-- horizontal axis, vertical loop -->
                <path d="M3 12h18" opacity=".35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 4c-2 0-3.5 3.6-3.5 8s1.5 8 3.5 8" opacity=".35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 4c2 0 3.5 3.6 3.5 8s-1.5 8-3.5 8M14.5 17.5 12 20l2.5 2.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </symbol>
            <symbol id="icon-rotate-y" viewBox="0 0 24 24">
                <!-- vertical axis, flat loop -->
                <path d="M12 3v18" opacity=".35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M4 12c0-2 3.6-3.5 8-3.5s8 1.5 8 3.5" opacity=".35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M4 12c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5M17.5 14.5 20 12l2.5 2.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </symbol>
            <symbol id="icon-rotate-z" viewBox="0 0 24 24">
                <!-- axis points out of the screen: circular arrow with a center dot -->
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2" fill="currentColor"/>
            </symbol>
        </defs>
    </svg>
    <div class="app">

        <!-- Header -->
        <header class="app-header">
            <div class="header-title">
                <h1>SOMA Cube Solver</h1>
                <p>Build, solve, and explore SOMA Cube solutions.</p>
            </div>

            <nav class="tabs" role="tablist" aria-label="Views">
                <button type="button" id="tab-puzzle" class="tab" role="tab" aria-selected="true">Puzzle</button>
                <button type="button" id="tab-leaderboard" class="tab" role="tab" aria-selected="false">Leaderboard</button>
            </nav>

            <div id="auth-panel" class="auth-panel">
                <div id="auth-logged-out" class="auth-logged-out">
                    <input
                        type="email"
                        id="auth-email"
                        placeholder="Email"
                        autocomplete="email"
                    >

                    <input
                        type="password"
                        id="auth-password"
                        placeholder="Password"
                        autocomplete="current-password"
                    >

                    <input
                        type="text"
                        id="auth-username"
                        placeholder="Username"
                        autocomplete="off"
                        maxlength="20"
                        hidden
                    >

                    <button type="button" id="auth-login" class="button button-secondary">
                        Log In
                    </button>

                    <button type="button" id="auth-signup" class="button button-primary">
                        Sign Up
                    </button>

                    <span id="auth-status"></span>
                </div>

                <div id="auth-logged-in" class="auth-logged-in">
                    <span id="auth-user-email"></span>
                
                    <span id="auth-username-prompt" class="auth-username-prompt" hidden>
                        <input
                            type="text"
                            id="auth-set-username"
                            placeholder="Choose a username"
                            autocomplete="off"
                            maxlength="20"
                        >
                        <button type="button" id="auth-set-username-btn" class="button button-primary">
                            Save
                        </button>
                    </span>
                
                    <span id="auth-profile-status"></span>
                
                    <button type="button" id="auth-logout" class="button button-secondary">
                        Log Out
                    </button>
                </div>
            </div>
        </header>

        <!-- Controls -->
        <section class="controls" aria-label="Puzzle controls">
            <div id="shape-selector" class="shape-selector"></div>

            <div class="button-group">
                <button id="check-solution" class="button button-primary">
                    Check Solution
                </button>

                <button id="hint" class="button button-accent">
                    Hint
                </button>

                <button id="reset-grid" class="button button-secondary">
                    Reset Grid
                </button>

                <button id="remove-selected" class="button button-secondary">
                    Remove Selected
                </button>
            </div>
            <div id="piece-controls" class="piece-controls" role="group" aria-label="Move and rotate selected piece">
                <div class="ctrl-group" role="group" aria-label="Move X / Y">
                    <button type="button" class="ctrl-btn" data-action="moveLeft"  aria-label="Move left"><svg aria-hidden="true"><use href="#icon-arrow-left"/></svg></button>
                    <button type="button" class="ctrl-btn" data-action="moveUp"    aria-label="Move up"><svg aria-hidden="true"><use href="#icon-arrow-up"/></svg></button>
                    <button type="button" class="ctrl-btn" data-action="moveDown"  aria-label="Move down"><svg aria-hidden="true"><use href="#icon-arrow-down"/></svg></button>
                    <button type="button" class="ctrl-btn" data-action="moveRight" aria-label="Move right"><svg aria-hidden="true"><use href="#icon-arrow-right"/></svg></button>
                </div>
            
                <div class="ctrl-group" role="group" aria-label="Move Z">
                    <button type="button" class="ctrl-btn ctrl-btn--wide" data-action="moveIn"  aria-label="Move in (Z minus)"><svg aria-hidden="true"><use href="#icon-in"/></svg><span>Z−</span></button>
                    <button type="button" class="ctrl-btn ctrl-btn--wide" data-action="moveOut" aria-label="Move out (Z plus)"><svg aria-hidden="true"><use href="#icon-out"/></svg><span>Z+</span></button>
                </div>
            
                <div class="ctrl-group" role="group" aria-label="Rotate">
                    <button type="button" class="ctrl-btn ctrl-btn--wide" data-action="rotateX" aria-label="Rotate around X"><svg aria-hidden="true"><use href="#icon-rotate-x"/></svg><span>X</span></button>
                    <button type="button" class="ctrl-btn ctrl-btn--wide" data-action="rotateY" aria-label="Rotate around Y"><svg aria-hidden="true"><use href="#icon-rotate-y"/></svg><span>Y</span></button>
                    <button type="button" class="ctrl-btn ctrl-btn--wide" data-action="rotateZ" aria-label="Rotate around Z"><svg aria-hidden="true"><use href="#icon-rotate-z"/></svg><span>Z</span></button>
                </div>
            </div>
        </section>

        <!-- Main workspace -->
        <main class="workspace">

            <!-- Available pieces -->
            <aside id="pieces-panel" class="pieces-panel">
                <div class="panel-header">
                    <h2>Available Pieces</h2>
                    <span class="panel-subtitle">Select a piece to place</span>
                </div>

                <div id="pieces-container" class="pieces-container"></div>
            </aside>

            <!-- Three.js area -->
            <section id="container" class="canvas-container" aria-label="SOMA Cube">
                <!-- Three.js canvas is inserted here -->
            </section>

        </main>
        <!-- Bottom panel: status + controls -->
        <footer class="bottom-panel">
            <div class="status-group">
                <div id="solution-counter" class="status-card">
                    <span>Solutions Found</span>
                    <strong>
                        <span id="solution-count">0</span>
                        <span class="status-divider">/</span>
                        <span id="total-solutions">0</span>
                    </strong>
                </div>

                <div id="hints-counter" class="status-card">
                    <span>Hints Used</span>
                    <strong id="hints-used-count">0</strong>
                </div>
            </div>

            <div id="instructions" class="instructions">
                <h2>Controls</h2>
                <div class="instructions-grid">
                    <p><kbd>Arrow Keys</kbd> Move in X/Y</p>
                    <p><kbd>Z</kbd> / <kbd>X</kbd> Move in/out</p>
                    <p><kbd>R</kbd> Rotate X</p>
                    <p><kbd>F</kbd> Rotate Y</p>
                    <p><kbd>V</kbd> Rotate Z</p>
                    <p><kbd>Delete</kbd> Remove piece</p>
                </div>
            </div>
        </footer>

        <section id="leaderboard-view" class="leaderboard" aria-label="Leaderboard" hidden>
            <div class="leaderboard-toolbar">
                <label for="leaderboard-shape">Show</label>
                <select id="leaderboard-shape"></select>
                <button type="button" id="leaderboard-refresh" class="button button-secondary">Refresh</button>
            </div>
        
            <div id="leaderboard-me" class="leaderboard-me"></div>
        
            <div class="leaderboard-table-wrap">
                <table id="leaderboard-table" class="leaderboard-table"></table>
            </div>
        
            <p id="leaderboard-note" class="leaderboard-note" role="status"></p>
        </section>

        <!-- Temporary messages -->
        <div id="message" role="status" aria-live="polite"></div>

    </div>
</body>
</html>
